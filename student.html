<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Trainee Login | TECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="forms.css">
</head>
<body>

<div class="admin-topbar">
  <span class="logo-word" style="font-size:20px;"><span>T</span><span>E</span><span>C</span><span>H</span><span>O</span></span>
  <span class="admin-topbar-tag">TRAINEE PORTAL</span>
  <a href="portal.html" class="topbar-back"><i class="fa-solid fa-arrow-left"></i> Portal</a>
</div>

<main class="admin-main">

  <!-- ============ LOGIN ============ -->
  <section id="screen-student-login" class="admin-screen active">
    <h2 class="screen-title">Trainee Login</h2>
    <form id="formStudentLogin" class="admin-form">
      <label>Trainee ID <input type="text" id="sId" required></label>
      <label>Password <input type="password" id="sPassword" required></label>
      <p class="form-error" id="sLoginError"></p>
      <button type="submit" class="admin-submit">Login</button>
    </form>
  </section>

  <!-- ============ DASHBOARD (view only) ============ -->
  <section id="screen-student-dash" class="admin-screen">
    <h2 class="screen-title"><span data-i18n="welcome_comma">Welcome,</span> <span id="sName"></span></h2>
    <div class="lang-toggle-bar" id="langToggleBar" style="margin-bottom:16px;">
      <button type="button" class="lang-toggle-btn" data-lang="en">English</button>
      <button type="button" class="lang-toggle-btn" data-lang="mr">मराठी</button>
      <button type="button" class="lang-toggle-btn" data-lang="hi">हिंदी</button>
    </div>
    <p class="screen-sub" data-i18n="profile_view_note">This is a view-only profile — for any corrections, please contact the institute.</p>
    <div id="sDetailWrap" class="detail-box"></div>

    <h3 class="sub-heading" data-i18n="fee_payment_history">Fee Payment History</h3>
    <div id="sFeeWrap" class="detail-box"></div>

    <h3 class="sub-heading" data-i18n="installment_schedule">Installment Schedule</h3>
    <div id="sInstWrap" class="detail-box"></div>

    <h3 class="sub-heading" data-i18n="student_undertaking_heading">Trainee Undertaking</h3>
    <div id="sUndertakingWrap"></div>

    <h3 class="sub-heading" data-i18n="student_declaration_heading">Trainee Declaration Form</h3>
    <div id="sDeclarationWrap"></div>

    <button class="admin-cancel" id="btnStudentLogout" data-i18n="logout">Logout</button>
  </section>

  <div class="policies-footer-link"><a href="terms.html"><i class="fa-solid fa-file-shield"></i> Policies</a></div>
</main>

<script src="i18n.js"></script>
<script src="student.js"></script>
<script src="agreements.js"></script>
</body>
</html>
